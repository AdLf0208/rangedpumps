[mod]
id = "rangedpumps"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "1d63e0a5a37a7a708eb0b32b49bf0dfeb28ed8a9"

# The pure scan and tank logic (standalone crate lib, injected as
# `crate::game::rangedpumps`).
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "rangedpumps"
source = "runtime.rs"

# Game-side glue: the block entity's tank, its tick, the commands.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "rangedpumps_state"
source = "support.rs"

# The pump block declares a block entity.
# The content half is inside this bundle (`data/rangedpumps-content.hmod`, the built
# `content/rangedpumps.hmod`): this writes it to `.horizon-cache/` and appends it to the dev-mod list, so
# one `.hnmod` installs the blocks/items and the code. The registry keeps one file per project, so a
# split port could not be listed; AE2 ships the same pattern (`docs/native-mods.md`, "Data files").
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

[[injection]]
id = "block-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "entity" },
]

# ... and ticks.
[[injection]]
id = "block-entity-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "ticks" },
]

# ... with one 32-bucket tank kept in the block entity's saved `fluids`
# (`native_block_entity_fluids`, API 54).
[[injection]]
id = "block-entity-fluids"
hook = "block_entity_fluids"
hook_version = 1
kind = "HEAD"
helper = "fluids.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "fluids", ty = "&mut Option<horizon_client::containers::ModFluidTanks>", value = "fluids" },
]

# Each tick: move the scan and drain a still source block into the tank.
[[injection]]
id = "block-entity-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "entity" },
]

# A right click reports the state and the tank.
[[injection]]
id = "right-click-block"
hook = "right_click_block"
hook_version = 1
kind = "HEAD"
helper = "right_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "canceled", ty = "&mut bool", value = "canceled" },
]

# After the level's tick: push the tank into neighbouring fluid handlers.
[[injection]]
id = "level-tick-post"
hook = "level_tick_post"
hook_version = 1
kind = "HEAD"
helper = "level_tick_post.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

# `/rangedpumps info|range`.
[[injection]]
id = "register-commands"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "register.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<NativeCommand>", value = "commands" },
]

[[injection]]
id = "perform-command"
hook = "perform_command"
hook_version = 1
kind = "HEAD"
helper = "perform.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "ran" },
]
